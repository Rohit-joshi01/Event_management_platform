# AFTR backend configuration. Every secret comes from environment variables — see ../.env.example.
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:7d}
      cookie:
        name: AFTR_SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

spring:
  application:
    name: aftr-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aftr}
    username: ${DATABASE_USERNAME:aftr}
    password: ${DATABASE_PASSWORD:aftr}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
      cleanup-cron: "0 */15 * * * *"
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  payments:
    dev-checkout-enabled: ${DEV_CHECKOUT_ENABLED:true}
  seed:
    enabled: ${SEED_DEMO_DATA:false}
  uploads:
    dir: ${UPLOAD_DIR:./uploads}
    max-bytes: 5242880
  rate-limit:
    max-attempts: ${AUTH_RATE_LIMIT:10}
    window-seconds: 60

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    org.hibernate.SQL: warn
